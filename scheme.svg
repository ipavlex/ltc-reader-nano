  <line x1="320" y1="320" x2="700" y2="320" stroke="#111" stroke-width="2"/>
  <circle cx="400" cy="320" r="4" fill="#111"/>
  <circle cx="490" cy="320" r="4" fill="#111"/>
  <circle cx="580" cy="320" r="4" fill="#111"/>

  <line x1="400" y1="320" x2="400" y2="280" stroke="#111" stroke-width="2"/>
  <rect x="385" y="200" width="30" height="80" fill="#fff" stroke="#111" stroke-width="2"/>
