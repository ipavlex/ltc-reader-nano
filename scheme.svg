  <rect x="415" y="700" width="30" height="80" fill="#fff" stroke="#111" stroke-width="2"/>
  <text x="408" y="745" text-anchor="end" font-size="13">R5 100k</text>
  <line x1="430" y1="780" x2="430" y2="805" stroke="#111" stroke-width="2"/>
  <use href="#gnd" x="430" y="808"/>

  <line x1="430" y1="680" x2="700" y2="680" stroke="#111" stroke-width="2"/>
  <circle cx="530" cy="680" r="4" fill="#111"/>
