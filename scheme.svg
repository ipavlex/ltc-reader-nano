  <use href="#gnd" x="530" y="781"/>
  <text x="553" y="730" font-size="13">C2 100nF</text>

  <rect x="700" y="240" width="220" height="500" rx="10" fill="#eef4fb" stroke="#2c5f8a" stroke-width="2.5"/>
  <text x="810" y="272" text-anchor="middle" font-size="20" font-weight="bold" fill="#2c5f8a">Arduino Nano</text>
  <text x="810" y="294" text-anchor="middle" font-size="12" fill="#567">ATmega328P · 16 МГц</text>
  <text x="810" y="718" text-anchor="middle" font-size="11" font-style="italic" fill="#567">компаратор → Timer1 ICP</text>

  <circle cx="700" cy="320" r="3" fill="#2c5f8a"/>
  <text x="712" y="325" font-size="14" font-weight="bold">D7 / AIN1</text>
  <circle cx="700" cy="680" r="3" fill="#2c5f8a"/>
  <text x="712" y="685" font-size="14" font-weight="bold">D6 / AIN0</text>

  <circle cx="920" cy="340" r="3" fill="#2c5f8a"/>
  <text x="908" y="345" text-anchor="end" font-size="14" font-weight="bold">D10 / CS</text>
  <circle cx="920" cy="400" r="3" fill="#2c5f8a"/>
  <text x="908" y="405" text-anchor="end" font-size="14" font-weight="bold">D11 / MOSI</text>
  <circle cx="920" cy="460" r="3" fill="#2c5f8a"/>
  <text x="908" y="465" text-anchor="end" font-size="14" font-weight="bold">D13 / SCK</text>
