  <text x="602" y="388" font-size="11" fill="#666">≈6 кГц с R1</text>

  <use href="#p5v" x="430" y="545"/>
  <line x1="430" y1="551" x2="430" y2="580" stroke="#c0392b" stroke-width="2"/>
