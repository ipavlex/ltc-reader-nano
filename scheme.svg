<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 860" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <g id="gnd" stroke="#111" stroke-width="2.5">
      <line x1="-14" y1="0" x2="14" y2="0"/>
      <line x1="-9" y1="6" x2="9" y2="6"/>
      <line x1="-4" y1="12" x2="4" y2="12"/>
    </g>
    <g id="p5v">
      <circle cx="0" cy="0" r="6" fill="#fff" stroke="#c0392b" stroke-width="2"/>
      <text x="0" y="-13" text-anchor="middle" font-size="13" font-weight="bold" fill="#c0392b">+5V</text>
    </g>
  </defs>

  <rect width="1300" height="860" fill="#ffffff"/>

  <text x="650" y="42" text-anchor="middle" font-size="22" font-weight="bold" fill="#111">LTC Reader — схема обвязки Arduino Nano</text>
  <text x="650" y="66" text-anchor="middle" font-size="14" fill="#666">входной кондиционинг LTC (компаратор: AIN0/AIN1) + подключение MAX7219</text>

  <polyline points="15,332 23,332 23,308 43,308 43,332 53,332 53,308 63,308 63,332 85,332" fill="none" stroke="#999" stroke-width="2"/>
  <circle cx="110" cy="320" r="5" fill="#fff" stroke="#111" stroke-width="2"/>
  <text x="108" y="290" text-anchor="middle" font-size="14" font-weight="bold">LTC IN</text>
  <text x="108" y="354" text-anchor="middle" font-size="11" fill="#666">аудио (±1 В)</text>

  <line x1="115" y1="320" x2="160" y2="320" stroke="#111" stroke-width="2"/>
