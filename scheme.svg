  <line x1="920" y1="340" x2="1060" y2="340" stroke="#111" stroke-width="2"/>
  <line x1="920" y1="400" x2="1060" y2="400" stroke="#111" stroke-width="2"/>
  <line x1="920" y1="460" x2="1060" y2="460" stroke="#111" stroke-width="2"/>
  <line x1="920" y1="560" x2="1060" y2="560" stroke="#c0392b" stroke-width="2"/>
  <text x="990" y="553" text-anchor="middle" font-size="11" fill="#c0392b">+5V</text>
  <line x1="920" y1="620" x2="1060" y2="620" stroke="#111" stroke-width="2"/>

  <rect x="1060" y="300" width="210" height="360" rx="10" fill="#fafafa" stroke="#444" stroke-width="2.5"/>
  <text x="1165" y="332" text-anchor="middle" font-size="20" font-weight="bold" fill="#444">MAX7219</text>
  <text x="1165" y="354" text-anchor="middle" font-size="12" fill="#666">8-значный 7-сегментный</text>

  <circle cx="1060" cy="340" r="3" fill="#444"/>
  <text x="1072" y="345" font-size="14" font-weight="bold">CS</text>
  <circle cx="1060" cy="400" r="3" fill="#444"/>
  <text x="1072" y="405" font-size="14" font-weight="bold">DIN</text>
  <circle cx="1060" cy="460" r="3" fill="#444"/>
  <text x="1072" y="465" font-size="14" font-weight="bold">CLK</text>
  <circle cx="1060" cy="560" r="3" fill="#444"/>
  <text x="1072" y="565" font-size="14" font-weight="bold">VCC</text>
  <circle cx="1060" cy="620" r="3" fill="#444"/>
  <text x="1072" y="625" font-size="14" font-weight="bold">GND</text>

  <rect x="1085" y="490" width="160" height="50" rx="8" fill="#16213e"/>
  <text x="1165" y="523" text-anchor="middle" font-size="20" font-weight="bold" font-family="Menlo, Courier New, monospace" fill="#ff6b35" letter-spacing="1">HH.MM.SS.FF</text>

  <rect x="980" y="680" width="300" height="155" rx="8" fill="#f8f8f8" stroke="#ccc"/>
  <text x="1000" y="706" font-size="13" font-weight="bold">Назначение элементов:</text>
  <text x="1000" y="728" font-size="12" fill="#333">C1 — отсекает DC источника</text>
  <text x="1000" y="747" font-size="12" fill="#333">R1 + C3 — ФНЧ ≈6 кГц (антидребезг)</text>
  <text x="1000" y="766" font-size="12" fill="#333">R2/R3 — смещение сигнала на Vcc/2</text>
  <text x="1000" y="785" font-size="12" fill="#333">R4/R5 + C2 — опора Vcc/2 (AIN0)</text>
  <text x="1000" y="804" font-size="12" fill="#333">D1/D2 — защита от перегрузки</text>
  <text x="1000" y="823" font-size="12" fill="#333">R1 — ограничение тока входа</text>
